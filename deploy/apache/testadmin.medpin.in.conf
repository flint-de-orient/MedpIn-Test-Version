# The TEST platform console, and the TEST API it talks to.
#
# testadmin.medpin.in is the console for the test backend (pm2 `clinq-staging`,
# port 4001, its own database). It never reaches production's port 4000: a
# console that can suspend every practice must not be pointed at live data from
# a test address. deploymentIsSeparate.test.js holds it to that.
#
# It shares a server with the live console, so it has its own folder
# (/var/www/medpin-testadmin) and its own generated policy file — deploying one
# must never overwrite the other. web/deploy.sh defaults to both.
#
# Copy to /etc/apache2/sites-available/testadmin.medpin.in.conf — do not retype it.
# This file exists because the same vhost has lived in a markdown code fence in
# admin/DEPLOY.md for weeks and the production box still answers 404 on
# /api/v1/health. A block somebody has to transcribe is a block that does not
# get applied.
#
#   sudo cp deploy/apache/testadmin.medpin.in.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo a2ensite testadmin.medpin.in
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then prove it, rather than assuming:
#   curl -s https://testadmin.medpin.in/api/v1/health
#
# NOTE: this server runs Apache. nginx is installed on the box and stopped, so
# anything written to /etc/nginx/ is never read — and an absent security header
# looks exactly like a permissive one. See deploymentTargetsApache.test.js.

<VirtualHost *:443>
    ServerName testadmin.medpin.in

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/testadmin.medpin.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/testadmin.medpin.in/privkey.pem

    DocumentRoot /var/www/medpin-testadmin

    # The API, from this host, so the session cookie is first-party.
    #
    # This is the line whose absence is the production blocker. The console
    # sets SameSite=Strict on its session cookie, which forbids sending it
    # cross-origin — so the API has to be reachable from the console's own
    # origin or the console cannot authenticate at all.
    #
    # Longest match first: Apache matches ProxyPass in file order, and a
    # ProxyPass for "/" written above this one would swallow the API too.
    ProxyPreserveHost On
    ProxyPass        /api/v1/ http://127.0.0.1:4001/api/v1/
    ProxyPassReverse /api/v1/ http://127.0.0.1:4001/api/v1/

    # Everything else is the static export. `FallbackResource` is wrong here:
    # this is a static export with real files per route, and a fallback would
    # answer a mistyped asset path with index.html instead of a 404.
    <Directory /var/www/medpin-testadmin>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    # The Content-Security-Policy, generated per build by web/scripts/csp.mjs and
    # uploaded by web/deploy.sh: `script-src 'self'` plus the hash of every
    # inline script this export contains, and nothing else. A fixed
    # `script-src 'self'` here blocked the Next console's own inline scripts and
    # left a blank page. Run deploy.sh before enabling this site — Apache will
    # not load a config that includes a file that is not there yet.
    Include /etc/apache2/conf-available/medpin-testadmin-csp.conf

    # A test copy of a clinical system: out of search results and link previews.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

    # The export hashes its asset filenames but not index.html, so the document
    # must revalidate or a stale one keeps calling an endpoint that has moved —
    # which fails as "Failed to fetch" and reads as the API being down.
    <FilesMatch "\.(html)$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>
</VirtualHost>

<VirtualHost *:80>
    ServerName testadmin.medpin.in
    Redirect permanent / https://testadmin.medpin.in/
</VirtualHost>
