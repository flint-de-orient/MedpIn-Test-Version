# Staging: the same application, a second time, on its own port and database.
#
#   sudo cp deploy/apache/staging.clinq.flintdeorient.in.conf /etc/apache2/sites-available/
#   sudo certbot --apache -d staging.clinq.flintdeorient.in
#   sudo a2ensite staging.clinq.flintdeorient.in
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# See deploy/STAGING.md for the pm2 side and the database.
#
# ---- Why a subdomain and not a path -------------------------------------
#
# `clinq.flintdeorient.in/staging/` would share an origin with production, and
# an origin is the unit of nearly every security boundary the app relies on:
# cookies, CORS, the console's SameSite=Strict session, localStorage. Staging
# would be able to read production's session, and a mistake in one would be a
# mistake in both. A separate hostname costs a DNS record.

<VirtualHost *:443>
    ServerName staging.clinq.flintdeorient.in

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/staging.clinq.flintdeorient.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.clinq.flintdeorient.in/privkey.pem

    # Port 4001. Production is 4000 and the two must never be the same number
    # in any file — see deploy/ecosystem.config.cjs, which is the one place
    # both are declared.
    ProxyPreserveHost On
    ProxyPass        /api/v1/ http://127.0.0.1:4001/api/v1/
    ProxyPassReverse /api/v1/ http://127.0.0.1:4001/api/v1/

    # Uploads are served by the app, not from disk here: staging's upload
    # directory is its own, and a DocumentRoot pointing at production's would
    # be the one place the two environments genuinely shared state.
    ProxyPass        /uploads/ http://127.0.0.1:4001/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:4001/uploads/

    # Keep it out of search results and out of anybody's link previews. This is
    # a copy of a clinical system; it should not be indexed even when empty.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer

    # A visible banner is not possible from Apache, so the header is the
    # signal: anything reading this host can tell it is not production without
    # having to parse the hostname.
    Header always set X-MedPin-Environment "staging"

    ErrorLog  ${APACHE_LOG_DIR}/staging-clinq-error.log
    CustomLog ${APACHE_LOG_DIR}/staging-clinq-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName staging.clinq.flintdeorient.in
    Redirect permanent / https://staging.clinq.flintdeorient.in/
</VirtualHost>
