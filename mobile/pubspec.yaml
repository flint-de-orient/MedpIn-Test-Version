name: akd_care
description: "MedPin — care connected. Clinical app for Dr. Amit Kumar Dey, Consultant Physician & Diabetologist."
publish_to: 'none'

# Bump the build number on every release you hand to a phone. Android refuses
# to install over a higher versionCode, and a split build adds an ABI offset on
# top of this number (armeabi-v7a +1000, arm64-v8a +2000) — so a plain
# universal build always ranks below a split one of the same version.
version: 1.0.0+8098

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # MediaType for multipart uploads. A transitive dep of dio, declared
  # explicitly because we import it directly — the server rejects anything
  # not in its ALLOWED_MIME set, so the content type must be set by hand.
  http_parser: ^4.1.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.69.2

  # i18n
  # Must track the intl version flutter_localizations pins for the installed
  # Flutter SDK, otherwise version solving fails outright.
  intl: ^0.20.2

  # On-device speech recognition. Deliberately transcribes to text before
  # sending: the triage engine matches text patterns, so audio that never
  # becomes text would bypass emergency detection entirely.
  speech_to_text: ^7.0.0

  # Biometric / device-credential app lock.
  local_auth: ^2.3.0

  # Local notifications (foreground + background while running). Short, proper
  # copy for appointment and clinic updates.
  flutter_local_notifications: ^18.0.1

  # Timezone-aware scheduling for medication reminders (zonedSchedule needs a
  # TZDateTime). Pure Dart; local zone is pinned to the clinic's Asia/Kolkata.
  timezone: ^0.10.0


  # Scroll straight to a specific message (tap a pinned banner or a reply quote),
  # which a lazy ListView cannot do since off-screen rows are not built.
  scrollable_positioned_list: ^0.3.8

  # Misc
  image_picker: ^1.1.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  record: ^6.2.1
  # Voice-note playback. Simpler/more reliable for local files than just_audio,
  # which failed to play server-verified MP3s on device.
  audioplayers: ^6.1.0
  path_provider: ^2.1.6
  # Documents in chat: pick any file, and open a downloaded one with the phone's
  # own viewer (PDF/Office/etc.).
  file_picker: ^8.1.4
  open_filex: ^4.5.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/images/
    # Role/gender/expression art. Missing files fall back to a drawn face,
    # so this can be filled in or replaced one image at a time.
    - assets/characters/
    # Illustrated section artwork for the image-led tiles.
    - assets/cards/

  # Bundled, not fetched. google_fonts downloads on first run, so a clinic on a
  # weak connection would see the first screen in the wrong face — and with no
  # signal at all it would stay wrong. Bundling buys type that is correct from
  # the first frame, offline.
  #
  # A variable font: one file carries every weight, so there is nothing to add
  # per weight here.
  #
  # Subset to the scripts this app actually renders. Upstream Inter carries
  # 2849 codepoints — Cyrillic, Greek, IPA, Vietnamese and ~744 private-use
  # stylistic alternates — none of which any of the three locales reach. Both
  # variable axes (opsz, wght) survive the cut, so every weight still resolves.
  # Bengali and Hindi are unaffected: Inter never had those glyphs, and they
  # fall back to the system font exactly as before.
  #
  # To regenerate after a font upgrade (fonttools, from the mobile/ directory):
  #
  #   python -m fontTools.subset <upstream-Inter.ttf> \
  #     --unicodes="U+0020-007E,U+00A0-00FF,U+0100-017F,U+0300-036F,\
  #                 U+2000-206F,U+2070-209F,U+20A0-20BF,U+2100-2138,\
  #                 U+2190-21FF,U+2200-22FF,U+25A0-25FF,U+2713-2717,U+FEFF" \
  #     --layout-features='*' --name-IDs='*' --recalc-bounds \
  #     --output-file=assets/fonts/Inter.ttf
  #
  # The ranges are deliberately wider than today's strings: Latin-1 and
  # Extended-A so an accented patient name renders, currency for the rupee,
  # subscripts for SpO₂, and the maths block for the ≥ and × in dose text.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
